# CoTURN Configuration for Remote Puppet

# Listener settings
listening-port=3478
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=49200

# Realm (your domain)
realm=remotepuppet.local

# Authentication
lt-cred-mech
user=turnuser:turnpassword

# Fingerprint for STUN
fingerprint

# Logging
verbose
log-file=/var/log/coturn/turnserver.log

# Disable old protocols
no-tlsv1
no-tlsv1_1

# Security
no-cli
secure-stun

# External IP (set this to your public IP in production)
# external-ip=YOUR_PUBLIC_IP

# Allow localhost connections for development
allow-loopback-peers

# Disable multicast peers
no-multicast-peers

# Quota settings
total-quota=100
bps-capacity=0
stale-nonce=600

# Max sessions per user
max-bps=3000000

# Disable DTLS for simplicity in dev (enable in production)
# no-dtls
